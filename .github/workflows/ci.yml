# Continuous integration (PROJECT_CONTEXT §11.4). Layers T1-T3 so far; T4-T7 join as their
# suites land. Test reports are uploaded on every run as evidence (NN-8). Workflow logs are
# visible only to signed-in users, so failures are also published as annotations and a job
# summary, which the public run page shows (scripts/ci_failure_report.py).
#
# Dependencies come from one cache, which only the `dependencies` job writes: it fetches every
# artifact, retrying while Maven Central refuses, and the other jobs restore its cache. Maven
# Central rate-limits GitHub's runners (HTTP 429, at times reported as "not found"). Before round
# 172 every job could write the shared cache, whichever finished first won, and the cache lacked
# Scala 2.13.17; from round 166 one job in each run failed downloading it.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: Dependencies (fetched once, cached)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Restore the dependency cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
            !~/.sbt/*.lock
            !~/**/ivydata-*.properties
          key: sbt-deps-${{ runner.os }}-${{ hashFiles('**/*.sbt', '**/project/build.properties', '**/project/**.scala', '**/project/**.sbt') }}
          restore-keys: sbt-deps-${{ runner.os }}-
      - name: Fetch every artifact, retrying while Maven Central refuses
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/ci-resolve.sh 2>&1 | tee sbt.log
      - name: Save the dependency cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
            !~/.sbt/*.lock
            !~/**/ivydata-*.properties
          key: sbt-deps-${{ runner.os }}-${{ hashFiles('**/*.sbt', '**/project/build.properties', '**/project/**.scala', '**/project/**.sbt') }}
      - name: Publish failure details (readable without signing in)
        if: failure()
        run: python3 scripts/ci_failure_report.py sbt.log

  checks:
    name: API rules, format, linkage
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - name: Restore the dependency cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
            !~/.sbt/*.lock
            !~/**/ivydata-*.properties
          key: sbt-deps-${{ runner.os }}-${{ hashFiles('**/*.sbt', '**/project/build.properties', '**/project/**.scala', '**/project/**.sbt') }}
          restore-keys: sbt-deps-${{ runner.os }}-
      - name: Engine API rules (ARCH-2, PLAT-7), with negative control
        run: |
          bash scripts/check-engine-api.sh --self-test
          bash scripts/check-engine-api.sh
      - name: Formatting (scalafmt)
        shell: bash
        run: sbt -v scalafmtCheckAll scalafmtSbtCheck 2>&1 | tee -a sbt.log
      - name: Linkage against the runtime scala-library (PLAT-3)
        shell: bash
        run: sbt -v -Dpprof.linkageCheck=true compile 2>&1 | tee -a sbt.log
      - name: Publish failure details (readable without signing in)
        if: failure()
        run: python3 scripts/ci_failure_report.py sbt.log

  test:
    name: test (JDK ${{ matrix.java }})
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: sbt/setup-sbt@v1
      - name: Restore the dependency cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
            !~/.sbt/*.lock
            !~/**/ivydata-*.properties
          key: sbt-deps-${{ runner.os }}-${{ hashFiles('**/*.sbt', '**/project/build.properties', '**/project/**.scala', '**/project/**.sbt') }}
          restore-keys: sbt-deps-${{ runner.os }}-
      - name: Compile and test (T1-T3)
        shell: bash
        run: sbt -v Test/compile test 2>&1 | tee sbt.log
      - name: Publish failure details (readable without signing in)
        if: failure()
        run: python3 scripts/ci_failure_report.py sbt.log
      - name: Publish test counts
        if: always()
        run: python3 scripts/ci_failure_report.py --counts
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: "**/target/test-reports/*.xml"
          if-no-files-found: warn

  connect:
    # Layer T8: the engine suites through a Spark Connect client served by an in-process
    # Connect server (ADR-0002).
    name: Spark Connect (T8)
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - name: Restore the dependency cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
            !~/.sbt/*.lock
            !~/**/ivydata-*.properties
          key: sbt-deps-${{ runner.os }}-${{ hashFiles('**/*.sbt', '**/project/build.properties', '**/project/**.scala', '**/project/**.sbt') }}
          restore-keys: sbt-deps-${{ runner.os }}-
      - name: Engine suites under Spark Connect (T8)
        shell: bash
        run: sbt -v -Dpprof.test.sparkApi=connect engine/test app/test 2>&1 | tee sbt.log
      - name: Publish failure details (readable without signing in)
        if: failure()
        run: python3 scripts/ci_failure_report.py sbt.log
      - name: Publish test counts
        if: always()
        run: python3 scripts/ci_failure_report.py --counts
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-connect
          path: "**/target/test-reports/*.xml"
          if-no-files-found: warn

  python:
    # The py4j wrappers (ADR-0009): their tests run in local Classic mode against the JARs this
    # commit builds for Spark 4.1, on PySpark 4.1.0 and on 4.0.0, the Spark of Databricks Runtime
    # 17.3 LTS (D-76), so that a use of an API missing from 4.0 fails here.
    name: Python wrappers (PySpark ${{ matrix.pyspark }} Classic)
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pyspark: ["4.1.0", "4.0.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Restore the dependency cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
            !~/.sbt/*.lock
            !~/**/ivydata-*.properties
          key: sbt-deps-${{ runner.os }}-${{ hashFiles('**/*.sbt', '**/project/build.properties', '**/project/**.scala', '**/project/**.sbt') }}
          restore-keys: sbt-deps-${{ runner.os }}-
      - name: Build the JARs
        shell: bash
        run: sbt -v numerics/package engine/package app/package 2>&1 | tee sbt.log
      - name: Python tests
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pyspark==${{ matrix.pyspark }} pytest==8.4.2
          .venv/bin/pip install -e python
          # The package's requirement must leave the chosen PySpark in place.
          .venv/bin/python -c "import pyspark; assert pyspark.__version__ == '${{ matrix.pyspark }}', pyspark.__version__"
          # Absolute paths: the tests run from python/, and Spark resolves relative spark.jars entries
          # against the JVM's working directory (rounds 30 to 56 failed this way).
          export PPROF_SPARK_JARS=$(ls "$PWD"/numerics/target/scala-2.13/pprof-spark-numerics_2.13-*.jar \
            "$PWD"/engine/target/scala-2.13/pprof-spark-engine_2.13-*.jar \
            "$PWD"/app/target/scala-2.13/pprof-spark-app_2.13-*.jar | paste -sd, -)
          echo "JARs: $PPROF_SPARK_JARS"
          cd python && ../.venv/bin/python -m pytest tests -q --junitxml=target/test-reports/pytest.xml
      - name: Publish test counts
        if: always()
        run: python3 scripts/ci_failure_report.py --counts
      - name: Publish failure details (readable without signing in)
        if: failure()
        run: python3 scripts/ci_failure_report.py sbt.log
