# Logging for forked test JVMs (wired through Test / javaOptions in build.sbt).
# Kept out of every module's resources so that no packaged JAR overrides cluster logging.
rootLogger.level = warn
rootLogger.appenderRef.console.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5p %c{1}: %m%n
logger.pprof.name = pprof.spark
logger.pprof.level = info
