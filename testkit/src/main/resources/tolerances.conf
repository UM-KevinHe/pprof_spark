# Tolerance classes of docs/PROJECT_CONTEXT.md §8.4: initial defaults, pending calibration
# against negative controls (decision D-09). NN-9: change a value only with a written
# justification, a negative control showing the tolerance still detects real defects, and
# maintainer approval.
#
# Acceptance rule (testkit Tolerance.accepts): |actual - expected| <= atol + rtol * |expected|.
# OI-09: define "relative, scaled by magnitude" (T-fn) and "absolute, scaled" (T-res) precisely.

# T-fn: objective, score and information at fixed parameter values
T-fn.rtol = 1e-12
T-fn.atol = 0
# T-iter: lockstep iterates over the first five iterations from identical starts
T-iter.rtol = 1e-10
T-iter.atol = 0
# T-coef: converged coefficients
T-coef.rtol = 1e-8
T-coef.atol = 1e-10
# T-var: standard errors and covariance
T-var.rtol = 1e-7
T-var.atol = 0
# T-base: baseline cumulative hazard and survival
T-base.rtol = 1e-8
T-base.atol = 0
# T-res: residuals
T-res.rtol = 0
T-res.atol = 1e-9
# T-meas: expected counts, ratios and rates (observed counts compare exactly)
T-meas.rtol = 1e-8
T-meas.atol = 0
# T-test: test statistics
T-test.rtol = 1e-8
T-test.atol = 0
# T-p: compare test statistics; below the threshold, compare log10 p with an absolute tolerance
T-p.log10.threshold = 1e-10
T-p.log10.atol = 1e-6
# T-flag: flags match exactly, except within this relative distance of a threshold
T-flag.boundary.rtol = 1e-8
# T-part: layout and platform invariance (R1, R2)
T-part.objective.rtol = 1e-12
T-part.objective.atol = 0
T-part.parameters.rtol = 1e-10
T-part.parameters.atol = 0
