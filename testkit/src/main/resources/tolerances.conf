# Tolerance classes of docs/PROJECT_CONTEXT.md §8.4: initial defaults, pending calibration
# against negative controls (decision D-09). NN-9: change a value only with a written
# justification, a negative control showing the tolerance still detects real defects, and
# maintainer approval.
#
# Acceptance rule (testkit Tolerance; D-09): a scalar passes when
#   |actual - expected| <= atol + rtol * |expected|;
# element i of a vector or packed matrix passes when
#   |a_i - e_i| <= atol + rtol * max(|e_i|, s),  s = the largest magnitude in the expected quantity,
# which is how "relative, scaled by magnitude" is defined. Calibrated against the Cox fixtures:
# docs/parity/cox-calibration.md. T-res scaling is fixed with the residuals specification (OI-09).

# T-fn: objective, score and information at fixed parameter values
T-fn.rtol = 1e-12
T-fn.atol = 0
# T-iter: lockstep iterates over the first five iterations from identical starts
T-iter.rtol = 1e-10
T-iter.atol = 0
# T-coef: converged coefficients
T-coef.rtol = 1e-8
T-coef.atol = 1e-10
# T-var: standard errors and covariance
T-var.rtol = 1e-7
T-var.atol = 0
# T-base: baseline cumulative hazard and survival
T-base.rtol = 1e-8
T-base.atol = 0
# T-res: residuals
T-res.rtol = 0
T-res.atol = 1e-9
# T-meas: expected counts, ratios and rates (observed counts compare exactly)
T-meas.rtol = 1e-8
T-meas.atol = 0
# T-test: test statistics
T-test.rtol = 1e-8
T-test.atol = 0
# T-opt: optimizer-limited estimates (three-stage stage 2: the variance components, intercept and BLUPs
# at a derivative-free optimizer's stopping point; X-030, D-42). Calibrated in
# docs/parity/three-stage-calibration.md: pprof_py's tight run against glmer at most 0.48 of it on the
# integral-outcome cases; the negative controls at least 23.9 times outside.
T-opt.rtol = 2e-4
T-opt.atol = 1e-6
# T-p: compare test statistics; below the threshold, compare log10 p with an absolute tolerance
T-p.log10.threshold = 1e-10
T-p.log10.atol = 1e-6
# T-flag: flags match exactly, except within this relative distance of a threshold
T-flag.boundary.rtol = 1e-8
# T-part: layout and platform invariance (R1, R2)
T-part.objective.rtol = 1e-12
T-part.objective.atol = 0
T-part.parameters.rtol = 1e-10
T-part.parameters.atol = 0
