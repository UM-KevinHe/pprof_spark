[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pprof-spark"
version = "0.1.0.dev0"
description = "Python access to pprof_spark, Spark-native provider profiling, through py4j (ADR-0009)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kevin He"}]
dependencies = ["pyspark>=4.1,<4.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pprof_spark*"]
